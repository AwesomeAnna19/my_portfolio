<!DOCTYPE html>
<html>
    <head>
        <title>Anna's Bench of Work!</title>
        <link rel="stylesheet" href="main.css">

        <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>

    <body>
        <h1>🤠</h1>

        <div class="container">
            <div class="block">
                <div class="block-title">
                    <h2>Welcome to Anna's Bench of Work!</h2>
                </div>
                
                <p>Howdy! I'm Anna Rosé, and welcome to my bench of work (or should I rather say, my portfolio)!</p>

                <div>
                    <ul class="buttons-list">
                        <li><button class="button" aria-label="About"><img src="icons/info.png" alt="About"></button></li>
                        <li><button class="button" aria-label="Work"><img src="icons/briefcase.png" alt="Work"></button></li>
                        <li><button class="button" aria-label="Projects"><img src="icons/folder.png" alt="Projects"></button></li>
                        <li><button class="button" aria-label="Links"><img src="icons/link-alt.png" alt="Links"></button></li>
                        <li><button class="button" aria-label="Contact"><img src="icons/paper-plane.png" alt="Contact"></button></li>
                    </ul>
                </div>

            </div>
        </div>

    <script type="text/babel" src="main.js"></script>
    </body>
</html>
